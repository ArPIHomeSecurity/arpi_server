# --- User: argus_reader (Read-Only Access) ---
user argus_reader

# Grant READ (subscribe) access to all topics (# is the multi-level wildcard)
topic read #

# --- User: argus_control (Read + alarm control) ---
# Account for external clients that also arm and disarm, like Home Assistant.
#
# The command topics (state/set) are write-only: their payload carries the plain
# access code of the user, so a readable command topic would allow harvesting the
# codes of every user. This only works because MQTT topic matching is level exact -
# the readable ".../+/state" does not match ".../+/state/set" - so do not replace
# the rules below with "arpi/alarm_control_panel/#".
user argus_control

topic read arpi/binary_sensor/#
topic read arpi/alarm_control_panel/+/config
topic read arpi/alarm_control_panel/+/state
topic write arpi/alarm_control_panel/+/state/set

# --- User: argus (Read/Write Access) ---
user argus

# Grant READ and WRITE access to all topics
topic readwrite #

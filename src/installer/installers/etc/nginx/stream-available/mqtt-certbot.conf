# MQTT over TLS with the certbot certificate, the broker itself only listens
# on a unix socket and holds no certificate
server {
    listen 8883 ssl;

    include snippets/stream-ssl.conf;
    ssl_certificate /etc/letsencrypt/live/arpi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arpi/privkey.pem;

    proxy_pass mqtt_broker;
    # must outlive the keepalive of the MQTT clients
    proxy_timeout 1h;
}

# This workflow automates the release process of the project.
# The workflow will bump the version, tag the commit,
# and create a new GitHub release with the build artifacts.
name: Release package

on:
  workflow_run:
    workflows:
      - CI / Format
      - CI / Lint
      - CI / Test
    types:
      - completed
    branches:
      - 'dev_*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'release'
        type: choice
        options:
          - major
          - minor
          - patch
          - pre-release
          - release
      pre_release:
        description: 'Pre-release identifier (optional, e.g., "beta", "rc1")'
        required: false
        type: string

jobs:
  release:
    name: Release
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          startsWith(github.event.workflow_run.head_branch, 'dev_') &&
          !contains(github.event.workflow_run.head_commit.message, 'GitHub Actions: bump version')
        )
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      models: read

    steps:
      - name: Check all CI workflows passed for this SHA 🔎
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const required = ['CI / Format', 'CI / Lint', 'CI / Test'];

            const { data: { workflow_runs: runs } } =
              await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
              });

            for (const name of required) {
              const passed = runs.some(r => r.name === name && r.conclusion === 'success');
              if (!passed) {
                core.notice(`Waiting: "${name}" has not succeeded yet for ${sha}`);
                core.setFailed(`Not all CI workflows have passed — skipping release.`);
                return;
              }
            }
            core.notice(`All CI workflows passed for ${sha}`);

      - name: Ensure manual release runs only on main branch 🚦
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "This workflow can only be run on the main branch. Current ref: ${{ github.ref }}"
            exit 1
          fi

      - name: Checkout repository 🛎️
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Configure Git 🔧
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Cache Python packages 📦
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-${{ hashFiles('Pipfile.lock') }}
          restore-keys: |
            pip-cache-${{ runner.os }}-

      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies 📦
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/task/task/setup.deb.sh' | sudo -E bash
          sudo apt update && sudo apt install -y jq task
          curl -LsSf https://astral.sh/uv/install.sh | sh
          task create-environment

      - name: Determine release mode 🏷️
        id: release_mode
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            # in case of manual trigger from main branch
            if [[ "${{ inputs.version_type }}" == "release" ]]; then
              echo "bump_args=-r -v" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            elif [[ "${{ inputs.version_type }}" == "pre-release" ]]; then
              pre_release_id="${{ inputs.pre_release }}"
              if [[ -z "$pre_release_id" ]]; then
                pre_release_id="RC"
              fi
              echo "bump_args=-p $pre_release_id -v" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "bump_args=-t ${{ inputs.version_type }} -v" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # on dev_ branches we create pre-releases by default with RC identifier
            echo "bump_args=-p RC -v" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version 🏷️
        run: |
          python scripts/bump_version.py ${{ steps.release_mode.outputs.bump_args }}

      - name: Get new version 📋
        id: get_version
        run: |
          VERSION=$(jq -r '.version' src/server/version.json)
          VERSION_SIMPLE=$(scripts/get_package_version.sh) # get python formatted version
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "simple_version=$VERSION_SIMPLE" >> $GITHUB_OUTPUT
          echo "New version: $VERSION"
          echo "Simple version: $VERSION_SIMPLE"

      - name: Commit version changes 💾
        run: |
          git add src/server/version.json
          git commit -m "GitHub Actions: bump version to $(echo '${{ steps.get_version.outputs.version }}' | sed 's/:.*//')"

      - name: Create Git tag 🏷️
        run: |
            git tag "$(echo '${{ steps.get_version.outputs.simple_version }}')" -m "Release version $(echo '${{ steps.get_version.outputs.version }}')"

      - name: Build and package server 🏗️
        run: |
          scripts/create_bootstrap_package.sh
          scripts/create_package.sh

      - name: Push changes and tags 🚀
        run: |
          git push origin HEAD:${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
          git push origin --tags

      - name: Collect commits for changelog 📋
        id: git_log
        run: |
          NEW_TAG="${{ steps.get_version.outputs.simple_version }}"
          # Find the previous stable tag by excluding the current one and all RC/pre-release tags
          PREV_TAG="$(git tag --sort=-version:refname \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${NEW_TAG}$" \
            | head -n 1 || true)"

          if [ -z "$PREV_TAG" ]; then
            RANGE="$(git rev-list --max-count=20 HEAD | tail -n 1)..HEAD"
            RANGE_LABEL="initial commits"
          else
            RANGE="$PREV_TAG..HEAD"
            RANGE_LABEL="$PREV_TAG → $NEW_TAG"
          fi

          # Filter out automated/noise commits
          COMMITS=$(git log --oneline "$RANGE" --no-merges \
            | grep -v -E "GitHub Actions: bump version|^[a-f0-9]+ Bump version|^[a-f0-9]+ Lint fix|^[a-f0-9]+ Code formatted|^[a-f0-9]+ Taskfile fix" \
            || true)

          echo "range_label=$RANGE_LABEL" >> "$GITHUB_OUTPUT"
          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog with Copilot ✍️
        id: copilot_summary
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMITS="${{ steps.git_log.outputs.commits }}"
          RANGE_LABEL="${{ steps.git_log.outputs.range_label }}"

          PROMPT="You are writing release notes for ArPI, a home security system project (Python/Flask/MQTT/Raspberry Pi). Based on these git commit messages, write a concise GitHub release changelog in markdown. Include: 1) a short 2-3 sentence summary paragraph, 2) a categorized bullet list grouping by Features / Bug Fixes / Testing / Tooling as relevant. Skip trivial or noisy commits. Commit list:\n\n${COMMITS}"

          RESPONSE=$(curl -s --fail -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "https://models.inference.ai.azure.com/chat/completions" \
            -d "$(jq -n --arg p "$PROMPT" '{model:"gpt-4o-mini",messages:[{role:"user",content:$p}],temperature:0.3,max_tokens:800}')")

          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$SUMMARY" ]; then
            # fallback to plain git log list when API is unavailable
            SUMMARY="## What's Changed ($RANGE_LABEL)"$'\n\n'
            while IFS= read -r line; do
              SUMMARY+="- ${line#* }"$'\n'
            done <<< "$COMMITS"
          fi

          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release 📦
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.simple_version }}
          name: ${{ steps.get_version.outputs.simple_version }}
          draft: false
          prerelease: ${{ steps.release_mode.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/arpi_server-${{ steps.get_version.outputs.simple_version }}-*.whl
            dist/arpi_server-bootstrap-${{ steps.get_version.outputs.simple_version }}.tar.gz
          body: |
            ## What's Changed

            ${{ steps.copilot_summary.outputs.summary || format('This release includes the latest changes from the {0} branch.', github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch) }}

            ### Build Information
            - **Version**: ${{ steps.get_version.outputs.version }}
            - **Branch**: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
            - **Build Date**: ${{ github.event_name == 'workflow_dispatch' && github.run_started_at || github.event.workflow_run.created_at }}
            - **Commit**: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
            - **Workflow Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})


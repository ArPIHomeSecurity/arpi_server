# This workflow automates the release process of the project.
# The workflow will bump the version, tag the commit,
# and create a new GitHub release with the build artifacts.
name: Release package

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - 'dev_*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'release'
        type: choice
        options:
          - major
          - minor
          - patch
          - pre-release
          - release
      pre_release:
        description: 'Pre-release identifier (optional, e.g., "beta", "rc1")'
        required: false
        type: string

jobs:
  release:
    name: Release
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          startsWith(github.event.workflow_run.head_branch, 'dev_') &&
          !contains(github.event.workflow_run.head_commit.message, 'GitHub Actions: bump version')
        )
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - name: Ensure manual release runs only on main branch 🚦
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "This workflow can only be run on the main branch. Current ref: ${{ github.ref }}"
            exit 1
          fi

      - name: Checkout repository 🛎️
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Configure Git 🔧
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Cache Python packages 📦
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-${{ hashFiles('Pipfile.lock') }}
          restore-keys: |
            pip-cache-${{ runner.os }}-

      - name: Setup Python 🐍
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies 📦
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/task/task/setup.deb.sh' | sudo -E bash
          sudo apt update && sudo apt install -y jq task
          curl -LsSf https://astral.sh/uv/install.sh | sh
          task create-environment

      - name: Determine release mode 🏷️
        id: release_mode
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            # in case of manual trigger from main branch
            if [[ "${{ inputs.version_type }}" == "release" ]]; then
              echo "bump_args=-r -v" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            elif [[ "${{ inputs.version_type }}" == "pre-release" ]]; then
              pre_release_id="${{ inputs.pre_release }}"
              if [[ -z "$pre_release_id" ]]; then
                pre_release_id="RC"
              fi
              echo "bump_args=-p $pre_release_id -v" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "bump_args=-t ${{ inputs.version_type }} -v" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # on dev_ branches we create pre-releases by default with RC identifier
            echo "bump_args=-p RC -v" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version 🏷️
        run: |
          python scripts/bump_version.py ${{ steps.release_mode.outputs.bump_args }}

      - name: Get new version 📋
        id: get_version
        run: |
          VERSION=$(jq -r '.version' src/server/version.json)
          VERSION_SIMPLE=$(scripts/get_package_version.sh) # get python formatted version
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "simple_version=$VERSION_SIMPLE" >> $GITHUB_OUTPUT
          echo "New version: $VERSION"
          echo "Simple version: $VERSION_SIMPLE"

      - name: Commit version changes 💾
        run: |
          git add src/server/version.json
          git commit -m "GitHub Actions: bump version to $(echo '${{ steps.get_version.outputs.version }}' | sed 's/:.*//')"

      - name: Create Git tag 🏷️
        run: |
            git tag "$(echo '${{ steps.get_version.outputs.simple_version }}')" -m "Release version $(echo '${{ steps.get_version.outputs.version }}')"

      - name: Build and package server 🏗️
        run: |
          scripts/create_bootstrap_package.sh
          scripts/create_package.sh

      - name: Push changes and tags 🚀
        run: |
          git push origin HEAD:${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
          git push origin --tags

      - name: Setup Node.js for Copilot CLI 🤖
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Copilot CLI 🛠️
        run: npm install -g @github/copilot

      - name: Generate AI release summary ✍️
        id: copilot_summary
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="$(git rev-list --max-count=20 HEAD | tail -n 1)..HEAD"
          fi

          copilot -p "Summarize the key changes in git range ${RANGE}. Output markdown only with:
          1) a short overview paragraph (max 80 words),
          2) a bullet list of the most important changes,
          3) a short note about version/release impact if visible.
          Write the result to summary.md" \
            --allow-tool='shell(git:*)' \
            --allow-tool=write \
            --no-ask-user

          cat summary.md >> "$GITHUB_STEP_SUMMARY"

          {
            echo "summary<<EOF"
            cat summary.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release 📦
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.simple_version }}
          name: ${{ steps.get_version.outputs.simple_version }}
          draft: false
          prerelease: ${{ steps.release_mode.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/arpi_server-${{ steps.get_version.outputs.simple_version }}-*.whl
            dist/arpi_server-bootstrap-${{ steps.get_version.outputs.simple_version }}.tar.gz
          body: |
            ## What's Changed

            ${{ steps.copilot_summary.outputs.summary && steps.copilot_summary.outputs.summary || format('This release includes the latest changes from the {0} branch.', github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch) }}

            ### Build Information
            - **Version**: ${{ steps.get_version.outputs.version }}
            - **Branch**: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
            - **Build Date**: ${{ github.event_name == 'workflow_dispatch' && github.run_started_at || github.event.workflow_run.created_at }}
            - **Commit**: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
            - **Workflow Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

